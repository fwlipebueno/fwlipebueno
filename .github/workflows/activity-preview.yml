name: Preview public activity surface refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'fwlipebueno/fwlipebueno' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch calendar and render both themes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-activity.mjs --refresh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-surface-preview
          path: contribution-preview/
          if-no-files-found: error
          retention-days: 7
