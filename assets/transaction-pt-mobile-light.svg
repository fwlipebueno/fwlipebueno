<title>Caso de uso comum · PostgreSQL</title><desc>HTTP e SQS chamam o mesmo caso de uso financeiro. Cada execução tem sua própria transação PostgreSQL, que salva a outbox de forma atômica com as alterações da carteira e do ledger. Após o commit, o relay publica os eventos no SQS.</desc>
