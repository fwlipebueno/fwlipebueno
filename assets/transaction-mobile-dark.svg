<title>Shared use case · PostgreSQL</title><desc>HTTP and SQS call the same financial use case. Each execution has its own PostgreSQL transaction, which saves the outbox atomically with the wallet and ledger changes. After commit, the relay publishes the events to SQS.</desc>
